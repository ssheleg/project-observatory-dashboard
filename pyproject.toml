[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-observatory"
version = "0.2.0"
description = "A local observation layer for agent-operated projects"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Project Observatory contributors"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX", "Operating System :: MacOS"]

[project.scripts]
project-observatory = "observatory.cli:main"

[tool.setuptools]
packages = ["observatory"]

[project.optional-dependencies]
full = ["mcp==2.1.1", "jsonschema==4.26.0", "sqlite-vec==0.1.9", "google-auth==2.58.0"]

[tool.setuptools.package-data]
observatory = ["engine/**/*", "engine/skill/.claude-plugin/*.json", "engine/skill/plugins/*/.claude-plugin/*.json"]
