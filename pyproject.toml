[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-observatory"
version = "0.1.0"
description = "A local observation layer for agent-operated projects"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Project Observatory contributors"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
project-observatory = "observatory.cli:main"

[tool.setuptools]
packages = ["observatory"]
