name: portable-release-check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Synthetic runtime and privacy tests
        run: python -m unittest discover -s tests -v
      - name: Public tree and complete Git blob history
        run: python tools/check_public_release.py --history
      - name: Public static site allowlist and negative probes
        run: python docs/site/check.py --self-test
      - name: Installed CLI sterile demo
        shell: bash
        run: |
          demo_root="$(mktemp -d)"
          demo_root="$(cd "$demo_root" && pwd -P)"
          project-observatory --home "$demo_root/state" demo
          project-observatory --home "$demo_root/state" doctor
          project-observatory --home "$demo_root/state" export
      - name: No tracked changes
        run: git diff --exit-code
