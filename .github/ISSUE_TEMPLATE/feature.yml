name: Feature request
description: A question Observatory should answer, or a source it should read.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to find out or do
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
  - type: textarea
    id: source
    attributes:
      label: Data source or provider involved, if any
